ruleset_version: "2026.01.1"
rules:
  - id: compute.stopped_instance_storage_cost
    version: "1.0.0"
    title: Stopped compute instance with ongoing charges
    category: compute
    severity: medium
    evaluator: stopped_instance_storage_cost
    enabled: true
    applicability:
      resource_kinds:
        - compute_instance
    thresholds:
      min_cost_minor: "100"
    required_signals:
      - costs
    remediation: |
      Stop incurring charges by terminating the instance if it is no longer needed, or detach and delete unused EBS volumes.
      Confirm no required data remains on attached storage before deletion.

  - id: storage.unattached_block_volume
    version: "1.0.0"
    title: Unattached block volume
    category: storage
    severity: medium
    evaluator: unattached_block_volume
    enabled: true
    applicability:
      resource_kinds:
        - block_volume
    thresholds: {}
    required_signals:
      - resources
      - relationships
    remediation: |
      Create a snapshot if backup is needed, then delete the unused volume to stop storage billing.

  - id: storage.stale_volume_snapshot
    version: "1.0.0"
    title: Stale volume snapshot
    category: storage
    severity: low
    evaluator: stale_volume_snapshot
    enabled: true
    applicability:
      resource_kinds:
        - volume_snapshot
    thresholds:
      max_age_days: "90"
    required_signals:
      - resources
    remediation: |
      Review whether the snapshot is still required for recovery or compliance.
      Delete obsolete snapshots to reduce storage cost after confirming retention policy.

  - id: governance.missing_cost_allocation_tags
    version: "1.0.0"
    title: Missing ownership or cost-allocation tags
    category: governance
    severity: low
    evaluator: missing_cost_allocation_tags
    enabled: true
    applicability:
      resource_kinds:
        - compute_instance
        - block_volume
        - database_instance
    thresholds:
      required_tag_keys: "Owner,CostCenter"
    required_signals:
      - resources
    remediation: |
      Apply the required Owner and CostCenter tags (or your organization's equivalents) for cost allocation and accountability.

  - id: compute.ec2_downsize_candidate
    version: "1.0.0"
    title: EC2 downsize candidate from utilization
    category: compute
    severity: medium
    evaluator: ec2_downsize_candidate
    enabled: true
    applicability:
      resource_kinds:
        - compute_instance
    thresholds:
      max_p95_cpu_percent: "25"
      min_sample_coverage_percent: "50"
      safety_headroom_bps: "1500"
    required_signals:
      - metrics
      - pricing
    providers:
      - aws
    required_capabilities:
      - metrics.cloudwatch_ec2
      - pricing.offline_catalog_fixture
    remediation: |
      Validate memory and disk performance, then resize to the recommended instance type during a maintenance window.

  - id: compute.ec2_idle_instance
    version: "1.0.0"
    title: Persistently idle EC2 instance
    category: compute
    severity: medium
    evaluator: ec2_idle_instance
    enabled: true
    applicability:
      resource_kinds:
        - compute_instance
    thresholds:
      min_idle_periods: "3"
    required_signals:
      - metrics
      - pricing
    providers:
      - aws
    required_capabilities:
      - metrics.cloudwatch_ec2
      - pricing.offline_catalog_fixture
    remediation: |
      Confirm the workload is decommissioned, then stop or terminate the instance and release unused elastic IPs.

  - id: storage.ebs_volume_type_optimize
    version: "1.0.0"
    title: EBS gp2 to gp3 optimization
    category: storage
    severity: low
    evaluator: ebs_volume_type_optimize
    enabled: true
    applicability:
      resource_kinds:
        - block_volume
    thresholds: {}
    required_signals:
      - resources
      - pricing
    providers:
      - aws
    required_capabilities:
      - pricing.offline_catalog_fixture
    remediation: |
      Modify volume type to gp3 after confirming baseline IOPS and throughput requirements.

  - id: database.rds_downsize_candidate
    version: "1.0.0"
    title: RDS downsize candidate
    category: database
    severity: medium
    evaluator: rds_downsize_candidate
    enabled: true
    applicability:
      resource_kinds:
        - database_instance
    thresholds:
      max_p95_cpu_percent: "30"
      safety_headroom_bps: "1500"
    required_signals:
      - metrics
      - pricing
    providers:
      - aws
    required_capabilities:
      - metrics.cloudwatch_rds
      - pricing.offline_catalog_fixture
    remediation: |
      Validate memory and connection limits, then modify the DB instance class during a maintenance window.

  - id: network.nat_gateway_low_utilization
    version: "1.0.0"
    title: Low-utilization NAT gateway
    category: network
    severity: low
    evaluator: nat_gateway_low_utilization
    enabled: true
    applicability:
      resource_kinds:
        - nat_gateway
    thresholds:
      max_bytes_out_per_hour: "104857600"
    required_signals:
      - metrics
      - pricing
    providers:
      - aws
    required_capabilities:
      - metrics.cloudwatch_nat
      - pricing.offline_catalog_fixture
    remediation: |
      Review whether VPC endpoints or consolidated egress can reduce NAT dependency before changing network topology.

  - id: compute.gce_downsize_candidate
    version: "1.0.0"
    title: GCE downsize candidate from utilization
    category: compute
    severity: medium
    evaluator: gce_downsize_candidate
    enabled: true
    applicability:
      resource_kinds:
        - compute_instance
    thresholds:
      max_p95_cpu_percent: "25"
      min_sample_coverage_percent: "50"
      safety_headroom_bps: "1500"
    required_signals:
      - metrics
      - pricing
    providers:
      - gcp
    required_capabilities:
      - metrics.cloud_monitoring_timeseries
      - pricing.cloud_billing_catalog
    remediation: |
      Validate memory, disk, and licensing constraints, then change machine type during a maintenance window.

  - id: network.gcp_idle_external_ip
    version: "1.0.0"
    title: Idle GCP external IP address
    category: network
    severity: low
    evaluator: gcp_idle_external_ip
    enabled: true
    applicability:
      resource_kinds:
        - elastic_ip
    thresholds: {}
    required_signals:
      - resources
    providers:
      - gcp
    remediation: |
      Release unused static external IPs or attach them to active resources.

  - id: storage.gcp_disk_type_optimize
    version: "1.0.0"
    title: GCP pd-standard to pd-balanced optimization
    category: storage
    severity: low
    evaluator: gcp_disk_type_optimize
    enabled: true
    applicability:
      resource_kinds:
        - block_volume
    thresholds: {}
    required_signals:
      - resources
      - pricing
    providers:
      - gcp
    required_capabilities:
      - pricing.cloud_billing_catalog
    remediation: |
      Migrate attached pd-standard disks to pd-balanced after confirming IO requirements.

  - id: database.cloudsql_downsize_candidate
    version: "1.0.0"
    title: Cloud SQL downsize candidate
    category: database
    severity: medium
    evaluator: cloudsql_downsize_candidate
    enabled: true
    applicability:
      resource_kinds:
        - database_instance
    thresholds:
      max_p95_cpu_percent: "30"
      safety_headroom_bps: "1500"
    required_signals:
      - metrics
      - pricing
    providers:
      - gcp
    required_capabilities:
      - metrics.cloud_monitoring_timeseries
      - pricing.cloud_billing_catalog
    remediation: |
      Validate connections and memory, then reduce Cloud SQL tier during maintenance.

  - id: network.gcp_nat_low_utilization
    version: "1.0.0"
    title: Low-utilization Cloud NAT gateway
    category: network
    severity: low
    evaluator: gcp_nat_low_utilization
    enabled: true
    applicability:
      resource_kinds:
        - nat_gateway
    thresholds:
      max_bytes_out_per_hour: "104857600"
    required_signals:
      - metrics
      - pricing
    providers:
      - gcp
    required_capabilities:
      - metrics.cloud_monitoring_timeseries
      - pricing.cloud_billing_catalog
    remediation: |
      Review VPC Service Controls and Private Google Access before removing Cloud NAT.

  - id: billing.gcp_committed_use_coverage
    version: "1.0.0"
    title: Committed use discount coverage opportunity
    category: billing
    severity: low
    evaluator: gcp_committed_use_coverage
    enabled: true
    applicability:
      resource_kinds:
        - compute_instance
    thresholds:
      min_eligible_spend_minor: "5000"
    required_signals:
      - costs
    providers:
      - gcp
    remediation: |
      Model 1- or 3-year committed use discounts only after stabilizing baseline compute usage; commitments reduce flexibility.
