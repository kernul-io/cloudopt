name: Release

on:
  push:
    tags:
      - '*'

env:
  GO_VERSION: "1.25.3"
  RELEASE_TAG: ${{ github.ref_name }}
  CGO_ENABLED: "0"

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64

    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -ldflags="-s -w" -o cloudopt ./cmd/

      - name: Package + checksum (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        run: |
          mkdir -p out/linux_amd64
          mv cloudopt out/linux_amd64/cloudopt
          tar -C out/linux_amd64 -czf cloudopt_${{ env.RELEASE_TAG }}_linux_amd64.tar.gz .
          shasum -a 256 cloudopt_${{ env.RELEASE_TAG }}_linux_amd64.tar.gz > cloudopt_${{ env.RELEASE_TAG }}_linux_amd64_checksums.txt

      - name: Package + checksum (Linux ARM64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/arm64' }}
        run: |
          mkdir -p out/linux_arm64
          mv cloudopt out/linux_arm64/cloudopt
          tar -C out/linux_arm64 -czf cloudopt_${{ env.RELEASE_TAG }}_linux_arm64.tar.gz .
          shasum -a 256 cloudopt_${{ env.RELEASE_TAG }}_linux_arm64.tar.gz > cloudopt_${{ env.RELEASE_TAG }}_linux_arm64_checksums.txt

      - name: Package + checksum (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          mkdir -p out/darwin
          mv cloudopt out/darwin/cloudopt
          tar -C out/darwin -czf cloudopt_${{ env.RELEASE_TAG }}_darwin.tar.gz .
          shasum -a 256 cloudopt_${{ env.RELEASE_TAG }}_darwin.tar.gz > cloudopt_${{ env.RELEASE_TAG }}_darwin_checksums.txt

      - name: Package + checksum (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\windows_amd64 | Out-Null
          Move-Item cloudopt out\windows_amd64\cloudopt.exe
          Compress-Archive -Path out\windows_amd64\* -DestinationPath "cloudopt_${{ env.RELEASE_TAG }}_windows_amd64.zip" -Force
          (Get-FileHash "cloudopt_${{ env.RELEASE_TAG }}_windows_amd64.zip" -Algorithm SHA256).Hash + "  cloudopt_${{ env.RELEASE_TAG }}_windows_amd64.zip" | Out-File -Encoding ASCII "cloudopt_${{ env.RELEASE_TAG }}_windows_amd64_checksums.txt"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG || 'no_tag' }}
          name: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            cloudopt_${{ env.RELEASE_TAG }}_linux_amd64.tar.gz
            cloudopt_${{ env.RELEASE_TAG }}_linux_amd64_checksums.txt
            cloudopt_${{ env.RELEASE_TAG }}_linux_arm64.tar.gz
            cloudopt_${{ env.RELEASE_TAG }}_linux_arm64_checksums.txt
            cloudopt_${{ env.RELEASE_TAG }}_darwin.tar.gz
            cloudopt_${{ env.RELEASE_TAG }}_darwin_checksums.txt
            cloudopt_${{ env.RELEASE_TAG }}_windows_amd64.zip
            cloudopt_${{ env.RELEASE_TAG }}_windows_amd64_checksums.txt
